name: org stars badges

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sum stars and write badge JSONs
        run: |
          write_badge() {
            file="$1"; total="$2"
            pretty=$(printf '%s' "$total" | awk '{if ($1 >= 1000) printf "%.1fk", $1/1000; else print $1}')
            printf '{"schemaVersion":1,"label":"stars","message":"%s","color":"FE7D37"}\n' "$pretty" > "$file"
            cat "$file"
          }
          jev=$(curl -sf "https://api.github.com/orgs/jev-chat/repos?per_page=100" | jq '[.[].stargazers_count] | add // 0')
          boss=$(curl -sf "https://api.github.com/repos/eatmoreduck/boss-zhipin-scraper" | jq '.stargazers_count // 0')
          write_badge jev-stars.json "$jev"
          write_badge boss-stars.json "$boss"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- jev-stars.json boss-stars.json && echo "no change" && exit 0
          git add jev-stars.json boss-stars.json
          git commit -m "chore: refresh star badges"
          git push
